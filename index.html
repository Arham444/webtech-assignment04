<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slides Application</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

  <header class="top-bar">
    <h2>Markdown Slides App</h2>
    <div class="top-actions">
      <button id="save-btn" class="btn primary">Save (Ctrl+S)</button>
    </div>
  </header>

  <main class="app-container" id="app-container">
    
    <section class="editor-section" id="editor-section">
      <label for="markdown-input" class="section-title">Markdown Editor</label>
      <textarea 
        id="markdown-input" 
        placeholder="Type your markdown here... Use '---' on a new line to separate slides."></textarea>
    </section>

    <section class="viewer-section" id="viewer-section">
      <div class="slide-card" id="slide-card">
        <div class="slide-content" id="slide-content"></div>
      </div>

      <footer class="slide-controls">
        <button id="prev-btn" class="btn">&larr; Left</button>
        <span id="slide-counter" class="slide-counter">0 / 0</span>
        <button id="next-btn" class="btn">Right &rarr;</button>
        <button id="fullscreen-btn" class="btn secondary">Full Screen</button>
      </footer>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
